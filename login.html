<!DOCTYPE html>
<html lang="en">

<head>
  <title>Login</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  

<style>
  body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #8ec5fc, #e0c3fc);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    form {
      width: 380px;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 26px;
    }

    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    label {
      font-weight: 600;
      display: block;
      margin: 12px 0 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      transition: 0.2s;
      outline: none;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #8e44ad;
      box-shadow: 0 0 0 3px rgba(142, 68, 173, 0.2);
    }

    .buttons {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .signinbtn {
      background: #4CAF50;
      color: white;
    }

    .signinbtn:hover {
      background: #43a047;
      transform: translateY(-2px);
    }

    .cancelbtn {
      background: #f44336;
      color: white;
    }

    .cancelbtn:hover {
      background: #e53935;
      transform: translateY(-2px);
    }
</style>

</head>


  <body>
    <!--Put mySQL database in action once done.  -->
    <form method="post" name="New User" data-netlify="true" onSubmit="submit"style="border:1px solid #ccc">
      <div class="container">
        <h1>Sign In</h1>
        <p>Login to continue</p>
        <!-- Put all forms required as a text -->
        <hr> 

        <label for="username"><b>Email</b></label>
        <input type="text" id= "username" placeholder="Enter Username" name="username" required>

        <label for="password"><b>Password</b></label>
        <input type="pwsd" id= "password" placeholder="Enter Password" name="Password" required>

    
        <div class="button">
          <button type="submit" id= Signinbtn class="signinbtn" onfocus="enableKeyboardNav(this, 'home.html')" onclick="window.location.href='home.html'">Sign In</button>

          <button type="cancel" id= cancelbtn class="cancelbtn" onfocus="enableKeyboardNav(this, 'index.html')" onclick="window.location.href='index.html'">Cancel</button>
        
        </div>
      </div>

    </form>

  </body>
</html>
